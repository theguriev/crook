name: Commit titles

# The release notes are generated from commit titles (script/release, through
# changelogen), and the generator drops every title that is not a Conventional
# Commit without saying so. This is the same check as the local commit-msg
# hook, run where a title can still be fixed: on every commit a pull request
# brings, and on the pull request's own title, since a squash merge makes that
# the commit main gets. Seconds on one runner, so it is automatic where the
# build matrix is not.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  titles:
    name: Every title is one the changelog can read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The pull request's commits, not just the merge commit checkout gives.
          fetch-depth: 0

      - name: The commits
        run: ./script/commit-lint "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: The pull request's title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./script/commit-lint --title "$TITLE"
