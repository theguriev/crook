name: Crook CI

# On every pull request to main, on every push to main, and when asked.
#
# A pull request's run checks the branch merged into the main it would land
# on, on macOS, Linux and Windows, of which its author's machine is one. The
# local gate in CONTRIBUTING.md takes one arm of every cfg!(target_os), and a
# test that was green there has put main red on macOS before. It is also the
# only run a pull request from outside can get, since a dispatch needs write
# access. The run on main is for what no pull request can see: two that are
# green on their own can break main together, as #269 and #270 did on
# 2026-09-22, and a run on every push to main names the merge that did it.
#
# It was dispatch only while the account could not pay for the minutes. Every
# run a push or a pull request started failed in three seconds with no log,
# and a check that always fails is worse than none: it stops meaning anything.
# The repository has been public since 2026-09-10, and a public repository's
# runners cost it nothing.
#
# A push to a branch with no pull request to main still starts nothing, and
# neither does a pull request stacked on another branch. When the branch it is
# stacked on merges and GitHub moves it onto main, the move is the `edited`
# action, which pull_request does not start on by default, so it waits for its
# next push. Adding `edited` to its types would not fix that: every title edit
# would then start a run in the pull request's group below and cancel the one
# in progress. Ask for either with `gh workflow run "Crook CI" --ref <branch>`
# or from the Actions tab.
#
# None of this replaces the gate in CONTRIBUTING.md, which is still run before
# a push. This is the second look, on the machines the first one was not run
# on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push to a pull request supersedes its older run, as a second
  # dispatch of a branch supersedes the first: nobody is waiting on the old
  # one. Main is never cancelled, and its runs get a group each rather than
  # one keyed on the ref, because by default GitHub drops a pending run when
  # a newer one joins its group, whatever cancel-in-progress says. A merge
  # that went unchecked could be the very one the run on main exists to name.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Backtraces in test failures are worth the debug info; nothing else is.
  RUSTFLAGS: -C debuginfo=line-tables-only
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  check:
    name: Checks (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            # `cargo metadata` writes the whole graph to stdout; each OS needs its own bit bucket.
            null_device: /dev/null
          - name: Linux
            runner: ubuntu-latest
            null_device: /dev/null
          - name: Windows
            runner: windows-latest
            null_device: "NUL"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Installs this platform's prerequisites and materializes the toolchain pinned in
      # rust-toolchain.toml. Running the real script here keeps it honest: a bootstrap that
      # rots is discovered by the next run of this rather than by the next contributor.
      - name: Bootstrap
        shell: bash
        run: ./script/bootstrap

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # A Cargo.lock that disagrees with the manifests makes every `--locked` step below fail
      # with a confusing error about an unrelated crate. Fail here instead, with a fix.
      - name: Ensure Cargo.lock is up to date
        shell: bash
        run: |
          cargo metadata --locked --format-version=1 > ${{ matrix.null_device }} \
            || (echo "::error::Cargo.lock is out of date with Cargo.toml. Run 'cargo check' and commit the result." && exit 1)

      - name: cargo fmt
        shell: bash
        run: cargo fmt --all --check

      - name: cargo clippy
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo check
        shell: bash
        run: cargo check --locked --workspace --all-targets

      # The shells the integration tests run for real, where the runner does
      # not have them already. A test for a shell that is not installed skips,
      # and without these every fish test did: the quoting of a typed argument,
      # completion on a fish that marks its own prompt, completions escaped as
      # words. Ubuntu's fish predates fish's own prompt marks and Homebrew's
      # has them, so the two runners cover both halves of the fish snippet.
      # zsh is installed on Linux as well, where no system rc sets HISTFILE for
      # it the way macOS's does; macOS ships its own. Windows has no pane these
      # snippets are for.
      - name: Shells the tests run for real
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q fish zsh
            # Ubuntu's /etc/zsh/zshrc runs compinit, and the runner leaves
            # directories on zsh's fpath writable by its group — so every zsh
            # the tests start stops at "Ignore insecure directories and
            # continue [y] or abort compinit [n]?" and never reaches a prompt.
            # A machine of somebody's own does not look like this; the runner
            # is made to.
            insecure=$(zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null || true)
            echo "compaudit: ${insecure:-nothing}"
            [ -z "$insecure" ] || echo "$insecure" | xargs sudo chmod g-w,o-w
          else
            brew install fish
          fi
          fish --version
          zsh --version

      - name: cargo test
        shell: bash
        run: cargo test --locked --workspace

      # The comments link to the code they explain, and a link to an item
      # that was renamed or removed is a comment that has quietly started
      # lying. Private items included, since almost every link is to one.
      # `redundant_explicit_links` keeps `[`Foo`](Foo)` — a target that only
      # repeats what the text already resolves to — out of the same comments.
      - name: cargo doc
        shell: bash
        run: cargo doc --locked --no-deps --workspace --document-private-items
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D rustdoc::redundant_explicit_links

      # The half of `crook_plugin_api` a host build never compiles: the
      # `#[link_section]` arms of `icon!` and `preview!` are gated on wasm32,
      # and they are the whole of the crate a plugin author builds against.
      # Checked, not run — there is nothing to run them on — so that a
      # change to the attribute's syntax fails here rather than in every
      # plugin's build after the crate is published.
      - name: cargo check (wasm32)
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p crook_plugin_api --tests --target wasm32-unknown-unknown

  release-flags:
    name: Release flags (${{ matrix.name }})
    # Type-checks the workspace with the profile and feature set a shipped build uses. A
    # feature combination that only breaks under `release_bundle` is otherwise discovered at
    # release time; this finds it in a few minutes and produces no artifacts.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Bootstrap
        shell: bash
        run: ./script/bootstrap

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: ./script/bundle --check-only
        shell: bash
        run: ./script/bundle --check-only

  linux-binary:
    name: Linux release binary
    # The build release.yml publishes, from the same file, down to the check
    # that holds it to glibc 2.31. The release-flags job type-checks with the
    # release's features; only a real build and link says which glibc the
    # binary needs, so this is the one place a branch can find out without a
    # tag. Nothing is uploaded.
    #
    # On pull requests too, not only on main. What breaks it is something a
    # pull request brings: a dependency or a toolchain pin that wants more than
    # glibc 2.31, a system library bootstrap installs and the image does not
    # have, a change to script/bundle. Found here, it is fixed in the pull
    # request that caused it; found on main, it holds up the next release,
    # whose linux job runs this same file before it publishes anything. What
    # it adds to a pull request's wait is small but not nothing: its one run
    # so far (36462938516, a dispatch) took five minutes with a cold cache and
    # was the last job to finish, 17 seconds after Checks (Windows), whose
    # cache was warm. With a cold cache, a Checks leg took 9 to 11 minutes on
    # main the same day.
    uses: ./.github/workflows/linux-binary.yml
