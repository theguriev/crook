name: Crook CI

# Asked for, never automatic. A push and a pull request used to start this, and
# every run they started failed in three seconds with no log — the account this
# repository is under cannot pay for minutes, so the only thing an automatic
# trigger produced was a red cross on every branch, on work whose real gate had
# already been run by hand. A check that always fails is worse than no check:
# it stops meaning anything, and the day one of these jobs fails for a reason
# nobody would look.
#
# So the gate is the four commands in CONTRIBUTING.md, run locally before a
# push, and this is here to be started from the Actions tab or with
# `gh workflow run "Crook CI" --ref <branch>` on a day the minutes exist.
on:
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs for the same ref; a second dispatch of the same
  # branch means the first is no longer the one anyone is waiting on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces in test failures are worth the debug info; nothing else is.
  RUSTFLAGS: -C debuginfo=line-tables-only
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  check:
    name: Checks (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            # `cargo metadata` writes the whole graph to stdout; each OS needs its own bit bucket.
            null_device: /dev/null
          - name: Linux
            runner: ubuntu-latest
            null_device: /dev/null
          - name: Windows
            runner: windows-latest
            null_device: "NUL"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Installs this platform's prerequisites and materializes the toolchain pinned in
      # rust-toolchain.toml. Running the real script here keeps it honest: a bootstrap that
      # rots is discovered by whoever dispatches this rather than by the next contributor.
      - name: Bootstrap
        shell: bash
        run: ./script/bootstrap

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # A Cargo.lock that disagrees with the manifests makes every `--locked` step below fail
      # with a confusing error about an unrelated crate. Fail here instead, with a fix.
      - name: Ensure Cargo.lock is up to date
        shell: bash
        run: |
          cargo metadata --locked --format-version=1 > ${{ matrix.null_device }} \
            || (echo "::error::Cargo.lock is out of date with Cargo.toml. Run 'cargo check' and commit the result." && exit 1)

      - name: cargo fmt
        shell: bash
        run: cargo fmt --all --check

      - name: cargo clippy
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo check
        shell: bash
        run: cargo check --locked --workspace --all-targets

      # The shells the integration tests run for real, where the runner does
      # not have them already. A test for a shell that is not installed skips,
      # and without these every fish test did: the quoting of a typed argument,
      # completion on a fish that marks its own prompt, completions escaped as
      # words. Ubuntu's fish predates fish's own prompt marks and Homebrew's
      # has them, so the two runners cover both halves of the fish snippet.
      # zsh is installed on Linux as well, where no system rc sets HISTFILE for
      # it the way macOS's does; macOS ships its own. Windows has no pane these
      # snippets are for.
      - name: Shells the tests run for real
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q fish zsh
            # Ubuntu's /etc/zsh/zshrc runs compinit, and the runner leaves
            # directories on zsh's fpath writable by its group — so every zsh
            # the tests start stops at "Ignore insecure directories and
            # continue [y] or abort compinit [n]?" and never reaches a prompt.
            # A machine of somebody's own does not look like this; the runner
            # is made to.
            insecure=$(zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null || true)
            echo "compaudit: ${insecure:-nothing}"
            [ -z "$insecure" ] || echo "$insecure" | xargs sudo chmod g-w,o-w
          else
            brew install fish
          fi
          fish --version
          zsh --version

      - name: cargo test
        shell: bash
        run: cargo test --locked --workspace

      # The comments link to the code they explain, and a link to an item
      # that was renamed or removed is a comment that has quietly started
      # lying. Private items included, since almost every link is to one.
      # `redundant_explicit_links` keeps `[`Foo`](Foo)` — a target that only
      # repeats what the text already resolves to — out of the same comments.
      - name: cargo doc
        shell: bash
        run: cargo doc --locked --no-deps --workspace --document-private-items
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links -D rustdoc::redundant_explicit_links

      # The half of `crook_plugin_api` a host build never compiles: the
      # `#[link_section]` arms of `icon!` and `preview!` are gated on wasm32,
      # and they are the whole of the crate a plugin author builds against.
      # Checked, not run — there is nothing to run them on — so that a
      # change to the attribute's syntax fails here rather than in every
      # plugin's build after the crate is published.
      - name: cargo check (wasm32)
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p crook_plugin_api --tests --target wasm32-unknown-unknown

  release-flags:
    name: Release flags (${{ matrix.name }})
    # Type-checks the workspace with the profile and feature set a shipped build uses. A
    # feature combination that only breaks under `release_bundle` is otherwise discovered at
    # release time; this finds it in a few minutes and produces no artifacts.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Bootstrap
        shell: bash
        run: ./script/bootstrap

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: ./script/bundle --check-only
        shell: bash
        run: ./script/bundle --check-only
