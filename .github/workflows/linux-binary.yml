name: Linux binary

# The Linux release binary, built the one way it is ever built, and held to
# the oldest glibc it promises to start on. release.yml calls this to make the
# archive it publishes, and ci.yml calls it so that a `Crook CI` dispatch
# proves the floor on a branch, with no tag. It is one file because the proof
# is only worth something if it runs the same build.
#
# A glibc-linked binary needs every symbol version it was linked against,
# and it gets them from the machine that linked it, not from the code. v0.1.13
# was linked on ubuntu-latest (24.04, glibc 2.39), and two weak references in
# Rust std, pidfd_spawnp and pidfd_getpid, left a GLIBC_2.39 need that is not
# weak. The loader on Ubuntu 22.04 and Debian 12 refused to start it. So the
# build runs in a Debian 11 container, whose glibc is 2.31, and that is the
# floor: Debian 11, Ubuntu 20.04, RHEL 9 and anything newer. The oldest runner
# GitHub offers, ubuntu-22.04, would still leave out all three. Nor is it
# cargo-zigbuild, which would have to stand in for cc as well as the linker,
# since ring compiles C.
on:
  workflow_call:
    inputs:
      ref:
        description: "What to check out and build; the caller's own commit when empty"
        type: string
        default: ""
      upload:
        description: "Upload the archive and its checksum as crook-x86_64-unknown-linux-gnu"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # What release.yml builds with. A called workflow does not inherit its
  # caller's env, and a CI run that built with ci.yml's debug info would not
  # be building the release.
  RUSTFLAGS: -C debuginfo=none

permissions:
  contents: read

jobs:
  build:
    name: Build in Debian 11, hold it to glibc 2.31
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The Rust in the image is not the one that builds: rustup reads
    # rust-toolchain.toml here as it does everywhere and fetches that channel.
    # The image is here for its glibc. Its 1.92.0 only saves a download while
    # the pin is also 1.92.0, and the digest keeps a re-pushed tag from
    # changing what a release is linked against.
    container:
      image: rust:1.92.0-bullseye@sha256:c6d501c039204c21e9fa374f234bd41bdc8b36cfd455a407ef145d9bef19f2b7
    env:
      GLIBC_FLOOR: "2.31"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}

      # No ./script/bootstrap here, unlike the other legs. The image already
      # holds everything the build needs (gcc, binutils, pkg-config, rustup),
      # and bootstrap would run apt against Debian 11, which reached the end of
      # its support in August 2026 and whose packages will move to
      # archive.debian.org. A build that installs nothing does not care.
      - name: The glibc it links against
        shell: bash
        run: |
          getconf GNU_LIBC_VERSION
          rustc --version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The image's CARGO_HOME, not ~/.cargo.
          path: |
            /usr/local/cargo/registry/index/
            /usr/local/cargo/registry/cache/
            /usr/local/cargo/git/db/
            target/
          # A key of its own, and a prefix no earlier key starts with. A
          # target/ built on the runner's own glibc must never be restored in
          # here: its objects were compiled against that glibc's headers, and
          # cargo's fingerprints do not say which glibc that was.
          key: x86_64-unknown-linux-gnu-glibc-${{ env.GLIBC_FLOOR }}-cargo-release-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: x86_64-unknown-linux-gnu-glibc-${{ env.GLIBC_FLOOR }}-cargo-release-

      - name: ./script/bundle --archive
        shell: bash
        run: ./script/bundle --target x86_64-unknown-linux-gnu --archive

      # Before the upload, so that a binary above the floor never reaches the
      # release job at all. Building here makes a need above 2.31 impossible;
      # this is what notices when the build has quietly stopped being here.
      - name: ./script/glibc-floor
        shell: bash
        run: ./script/glibc-floor "$GLIBC_FLOOR" dist/linux/crook

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.upload
        with:
          name: crook-x86_64-unknown-linux-gnu
          # The binary in dist/linux/ is the same bytes as the one inside the
          # archive; only the archive and its checksum go up.
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
