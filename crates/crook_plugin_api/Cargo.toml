[package]
name = "crook_plugin_api"
description = "What a sandboxed Crook plugin and its host say to each other."
authors.workspace = true
edition.workspace = true
# Not the workspace's version, and this is the one crate here that does not
# take it. The number after the zero is the ABI this vocabulary is at, so
# `crook_plugin_api = "0.8"` — Cargo's own compatibility range for a 0.x crate
# — is the same sentence as "built against Crook's plugin ABI 8". A host
# accepts one ABI and refuses every other by name, so a dependency range wider
# than that would be a plugin that compiles and is then turned away at load.
# `tests.rs` asserts the coupling rather than trusting whoever bumps one of
# the two numbers to remember the other.
version = "0.8.0"
# The one crate in this workspace that is published. A plugin is written
# outside this repository, by somebody who has no copy of the terminal, and
# every plugin written so far has had to *vendor* this file to do it — which
# is exactly how a host and a guest come to hold two lists of capabilities
# that disagree.
publish = true
license = "MIT"
readme = "README.md"
# Where a plugin author is sent, rather than where this file is edited: the
# registry is the public half of the ecosystem, and it is what somebody
# reading this crate on crates.io is looking for.
homepage = "https://github.com/theguriev/crook-plugins"
keywords = ["crook", "terminal", "plugin", "wasm", "abi"]
categories = ["api-bindings", "wasm"]
# Edition 2024's own floor. Nothing here is newer than that — the crate is
# `no_std` data types and two derives — and CI compiles it at the version
# `rust-toolchain.toml` pins.
rust-version = "1.85"

[dependencies]
# Two, and both are the wire. `serde` derives the shapes and `postcard` is what
# they cross the sandbox boundary as: a self-describing format would spend
# bytes on field names on every frame, and JSON would spend them on quotes and
# commas. Both are pure Rust with no C anywhere, which is the rule
# `docs/architecture.md` states and the reason `wasmi` was chosen over
# `wasmtime` in the first place.
#
# `default-features = false` on both, because this crate is also compiled into
# every plugin: a guest is `no_std` and links no allocator it did not bring.
postcard.workspace = true
# Not through the workspace, which turns `std` on for everybody else: a guest
# is `no_std` and this crate is compiled into every one of them.
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
