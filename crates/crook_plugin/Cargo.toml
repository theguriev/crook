[package]
name = "crook_plugin"
description = "Crook's plugin vocabulary: identities, manifests, and the registries a contribution lives in."
license = "MIT"
authors.workspace = true
edition.workspace = true
version.workspace = true
publish.workspace = true

# Deliberately none, and it is worth keeping that way. This crate is the one
# every plugin compiles against, so every dependency it takes is a dependency it
# imposes on the whole ecosystem — and a version of it somebody else's plugin
# has to agree with. Identities are strings, registries are vectors, and the
# guard is a boxed closure.
[dependencies]
