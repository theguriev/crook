[workspace]
members = ["crates/*", "app"]
resolver = "3"

[workspace.package]
authors = ["Eugen Guriev <gurievcreative@gmail.com>"]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# Local crates.
crook_plugin = { path = "crates/crook_plugin" }
crook_plugin_api = { path = "crates/crook_plugin_api" }
crook_wasm = { path = "crates/crook_wasm" }
crook_terminal = { path = "crates/crook_terminal" }
crookui = { path = "crates/crookui" }
crookui_core = { path = "crates/crookui_core" }

# --- Shared third-party dependencies -----------------------------------------
#
# Every dependency here builds on macOS, Linux and Windows with no system
# library and no build script. That is a deliberate constraint: the moment one
# of them needs `pkg-config` or a vendored toolchain, cross-platform CI stops
# being free. See docs/architecture.md.

alacritty_terminal = "0.26"
anyhow = "1.0"
# Text only: the default features pull in `image` for clipboard images, which
# nothing here puts on a clipboard.
arboard = { version = "3.6", default-features = false }
async-executor = "1.14"
async-task = "4.7"
blocking = "1.7"
bytemuck = { version = "1.25", features = ["derive"] }
# A time zone is a table that ships with an operating system, and the standard
# library does not read it. One call — how far this machine is from UTC —
# which a plugin needs before it can say which day something happened on.
chrono = "0.4"

cosmic-text = "0.19"
dirs = "6.0"
env_logger = "0.11"
etagere = "0.3"
futures-lite = "2.6"
log = "0.4"
parking_lot = "0.12"
# Encoding an offscreen render so a human, or CI, can look at it: `--snapshot`,
# the examples, and the renderer's own tests.
png = "0.18"
pollster = "0.4"
# The wire a sandboxed plugin's answers cross. Not self-describing on purpose:
# a contribution is decoded once per frame per slot, and field names on the
# wire would be bytes spent every time on something both sides already know.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
portable-pty = "0.9"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15"
swash = "0.2"
thiserror = "2.0"
# The sandbox a store plugin runs in. Chosen over `wasmtime` for one reason,
# and it is the reason everything else in this file is chosen: it is pure Rust
# with no `cc` anywhere in its graph — fourteen crates and not one build script
# that shells out to a compiler.
wasmi = { version = "2.0", features = ["portable-dispatch"] }
# Assembling wasm from its text format, which is how the tests build a plugin
# without a wasm toolchain being installed.
wat = "1"
unicode-segmentation = "1.13"
# The same East Asian width table the terminal emulator lays its grid out with,
# so the input field gives a CJK filename the two columns the shell will echo it
# back in.
unicode-width = "0.2"
# rustls only: no OpenSSL headers on Linux, no schannel quirks on Windows.
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }
wgpu = { version = "30.0", default-features = false, features = [
  "dx12",
  "gles",
  "metal",
  "vulkan",
  "wgsl",
  "std",
  "parking_lot",
] }
winit = "0.30"

[profile.dev]
# The renderer is unusably slow in a fully unoptimized build, but compiling the
# workspace at opt-level 3 costs a minute per touch. Optimize dependencies only.
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
