[package]
name = "crook"
description = "A terminal whose unit of work is an agent."
license = "MIT"
authors.workspace = true
edition.workspace = true
version.workspace = true
publish.workspace = true
default-run = "crook-dev"
# Everything lives in the lib; the bins are 20-line channel shims. Retrofitting
# this layout after a main.rs exists means touching every module path, so it is
# here from the first commit.
autobins = false

[lib]
name = "crook"
path = "src/lib.rs"

[[bin]]
name = "crook-dev"
path = "src/bin/dev.rs"

[[bin]]
name = "crook"
path = "src/bin/stable.rs"

[features]
default = []
# Set for shipped builds: hides the console window on Windows.
release_bundle = []

[dependencies]
crook_terminal.workspace = true
crook_usage.workspace = true
crookui.workspace = true
crookui_core.workspace = true

anyhow.workspace = true
# The settings file lives in the platform's configuration directory.
dirs.workspace = true
env_logger.workspace = true
log.workspace = true
# `--snapshot` writes a real frame to a file so a human, or CI, can look at it.
png.workspace = true
serde.workspace = true
serde_json.workspace = true
